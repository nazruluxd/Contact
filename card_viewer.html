<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --card-accent-clr:#2EC4A6; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#F1ECE0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding:26px 16px 60px;
  }

  #card-render{
    width:100%;
    max-width:400px;
    background:#e9f7f2;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
    height:fit-content;
  }
  .banner{
    position:relative;
    height:170px;
    background:#d9d9d9 no-repeat center/cover;
  }
  .logo-box{
    position:absolute;
    top:12px; right:12px;
    background:#fff;
    padding:6px 10px;
    max-width:110px;
    max-height:52px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .logo-box img{max-width:100%; max-height:40px; object-fit:contain;}
  .avatar-wrap{
    position:absolute;
    left:16px; bottom:-32px;
    width:82px; height:82px;
    border-radius:50%;
    border:3px solid #fff;
    background:#ccc no-repeat center/cover;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }
  .card-body{ background:#fff; padding:46px 20px 24px; }
  .c-name{ font-weight:800; font-size:24px; color:#1a1a1a; margin:0 0 4px; }
  .c-line{ font-size:15px; color:#3a3a3a; line-height:1.35; font-weight:500; }
  .c-sub{ font-size:12.5px; color:#8a8a8a; margin-top:6px; line-height:1.4; }

  .contacts{margin-top:18px; display:flex; flex-direction:column; gap:2px;}
  .contact-row{
    display:flex; align-items:center; gap:12px;
    text-decoration:none; padding:9px 6px; border-radius:10px;
    transition:background 0.15s ease, transform 0.1s ease; cursor:pointer;
  }
  .contact-row:hover{background:#f2f9f6; transform:translateX(2px);}
  .contact-row:active{transform:scale(0.98);}
  .c-icon{
    width:36px; height:36px; border-radius:50%;
    background:var(--card-accent-clr);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px; flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .contact-row:hover .c-icon{transform:scale(1.08);}
  .c-text b{display:block; font-size:14px; color:#1a1a1a;}
  .c-text span{font-size:11.5px; color:#999;}

  .card-section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
    color:#9a9a9a; margin:20px 0 8px;
  }
  .badges{display:flex; flex-direction:column; gap:6px;}
  .badges div{ background:#f0efe9; font-size:12px; font-weight:600; color:#222; padding:9px 10px; line-height:1.3;}

  .services{display:flex; flex-direction:column; gap:9px;}
  .service-item{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:#333; line-height:1.4;}
  .service-item .tick{
    width:19px; height:19px; border-radius:50%;
    background:var(--card-accent-clr); color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-top:1px;
  }

  .gallery{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .gallery img{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px;
    cursor:pointer; transition:transform 0.15s ease; background:#eee;
  }
  .gallery img:hover{transform:scale(1.03);}

  .save-btn{
    margin-top:22px; width:100%;
    background:var(--card-accent-clr); color:#fff; border:none;
    padding:15px; border-radius:26px; font-size:15.5px; font-weight:700;
    font-family:'Inter',sans-serif; text-align:center; cursor:pointer;
    transition:transform 0.1s ease, box-shadow 0.15s ease;
  }
  .save-btn:hover{box-shadow:0 6px 16px rgba(0,0,0,0.18);}
  .save-btn:active{transform:scale(0.97);}

  .brand-foot{
    text-align:center; margin-top:16px;
    font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.5px; color:#8a8577; text-decoration:none;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(10,10,8,0.9);
    display:none; align-items:center; justify-content:center;
    z-index:1000; padding:24px; cursor:zoom-out;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,0.4);}

  .state-msg{
    text-align:center; color:#4A473D;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    padding:60px 20px; max-width:340px; line-height:1.6;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translate(-50%, 20px);
    background:#15140F; color:#fff;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.4px;
    padding:12px 20px; border-radius:4px; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease; z-index:999;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
</style>
</head>
<body>

<div id="card-render">
  <div class="state-msg">Loading card…</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD6oI4kGHyyU_ugfiAp0y5fX4Yh7dvlVEA",
    authDomain: "portfolio-ec28a.firebaseapp.com",
    projectId: "portfolio-ec28a",
    storageBucket: "portfolio-ec28a.firebasestorage.app",
    messagingSenderId: "570524528938",
    appId: "1:570524528938:web:229d182658576811acae53"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  const ICONS = {
    phone: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    email: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>',
    website: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg>',
    location: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    portfolio: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" stroke="none"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20z"/><path d="M9.1 7.6c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3s1 2.6 1.1 2.8c.1.2 2 3 4.8 4.2 2.3 1 2.8.8 3.3.7.5-.1 1.6-.6 1.8-1.3.2-.6.2-1.2.2-1.3-.1-.1-.2-.2-.5-.3l-1.9-.9c-.3-.1-.5-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.5-2.3-1.5-.8-.7-1.4-1.6-1.6-1.9-.1-.2 0-.4.1-.5l.4-.5c.1-.2.2-.3.2-.5.1-.2 0-.4 0-.5l-.9-2.1z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" stroke="none"><rect x="2" y="2" width="20" height="20" rx="3" fill="none"/><path d="M6.94 8.5a1.94 1.94 0 1 0 0-3.88 1.94 1.94 0 0 0 0 3.88zM5.25 10.25h3.38V19H5.25v-8.75zM10.75 10.25h3.24v1.2h.05c.45-.8 1.55-1.65 3.2-1.65 3.42 0 4.05 2.1 4.05 4.85V19h-3.38v-4.6c0-1.1 0-2.5-1.5-2.5-1.5 0-1.75 1.2-1.75 2.42V19h-3.4v-8.75z"/></svg>',
    paypal: '<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" stroke="none"><path d="M7.5 4.5h5.4c2.7 0 4.3 1.4 3.9 3.9-.4 2.9-2.4 4.4-5.3 4.4H9.9l-.7 4.2H6.4l1.1-12.5zm2.1 2.1-.5 3.2h1.6c1.3 0 2.2-.6 2.4-1.9.2-1.1-.5-1.3-1.6-1.3H9.6z"/><path d="M13.8 8.3c1.9.2 3-.7 3.4-2.6.1-.7.1-1.2 0-1.5-.8.3-1.5.9-1.8 1.9-.3.9-.9 1.7-1.6 2.2z" opacity=".55"/></svg>'
  };
  const iconFor = t => ICONS[t] || '';

  function hrefFor(type, val){
    if(!val) return '#';
    switch(type){
      case 'phone': return `tel:${val.replace(/[^\d+]/g,'')}`;
      case 'email': return `mailto:${val}`;
      case 'website': return val.startsWith('http') ? val : `https://${val}`;
      case 'location': return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(val)}`;
      case 'portfolio': return val.startsWith('http') ? val : `https://${val}`;
      case 'instagram': return val.startsWith('http') ? val : `https://instagram.com/${val.replace('@','')}`;
      case 'whatsapp': return `https://wa.me/${val.replace(/[^\d]/g,'')}`;
      case 'linkedin': return val.startsWith('http') ? val : `https://linkedin.com/in/${val}`;
      case 'paypal': return val.startsWith('http') ? val : `https://paypal.me/${val}`;
      default: return '#';
    }
  }

  function buildVCard(f){
    const name = (f.name||'').trim();
    const parts = name.split(' ');
    const last = parts.length>1 ? parts.pop() : '';
    const first = parts.join(' ');
    let vcf = 'BEGIN:VCARD\nVERSION:3.0\n';
    vcf += `N:${last};${first};;;\n`;
    vcf += `FN:${name}\n`;
    if(f.company) vcf += `ORG:${f.company}${f.dept?';'+f.dept:''}\n`;
    if(f.title) vcf += `TITLE:${f.title}\n`;
    if(f.phone) vcf += `TEL;TYPE=CELL:${f.phone}\n`;
    if(f.email) vcf += `EMAIL:${f.email}\n`;
    if(f.website) vcf += `URL:${f.website}\n`;
    if(f.location) vcf += `ADR;TYPE=WORK:;;${f.location};;;;\n`;
    vcf += 'END:VCARD';
    return vcf;
  }

  function showToast(msg){
    let t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 2400);
  }

  function openLightbox(src){
    let lb = document.getElementById('lightbox');
    if(!lb){
      lb = document.createElement('div');
      lb.id = 'lightbox';
      lb.className = 'lightbox';
      lb.innerHTML = '<img id="lightbox-img">';
      lb.addEventListener('click', ()=> lb.classList.remove('show'));
      document.body.appendChild(lb);
    }
    document.getElementById('lightbox-img').src = src;
    lb.classList.add('show');
  }

  function renderCard(data){
    const f = data.fields || {};
    const accent = f['f-accent'] || '#2EC4A6';
    document.documentElement.style.setProperty('--card-accent-clr', accent);

    const images = data.images || {};
    const badges = (data.badges || []).filter(b => (b||'').trim());
    const services = (data.services || []).filter(s => (s||'').trim());
    const gallery = data.gallery || [];

    const contactFields = {
      phone: f['f-phone'], email: f['f-email'], website: f['f-website'],
      location: f['f-location'], portfolio: f['f-portfolio'],
      instagram: f['f-instagram'], whatsapp: f['f-whatsapp'],
      linkedin: f['f-linkedin'], paypal: f['f-paypal']
    };
    const rows = [
      {type:'phone', label:'Mobile', val:contactFields.phone},
      {type:'email', label:'Personal', val:contactFields.email},
      {type:'website', label:'Website', val:(contactFields.website||'').replace(/^https?:\/\//,'')},
      {type:'location', label:'', val:contactFields.location},
      {type:'portfolio', label:'', val:contactFields.portfolio ? ((f['f-portfolio-label']||'').trim() || 'Portfolio') : ''},
      {type:'instagram', label:'', val:contactFields.instagram ? 'Instagram' : ''},
      {type:'whatsapp', label:'', val:contactFields.whatsapp ? 'Connect with me on WhatsApp' : ''},
      {type:'linkedin', label:'', val:contactFields.linkedin ? 'Connect with me on LinkedIn' : ''},
      {type:'paypal', label:'', val:contactFields.paypal ? 'Paypal' : ''}
    ].filter(r => r.val);

    const html = `
      <div class="banner" style="${images.banner ? `background-image:url(${images.banner})` : ''}">
        <div class="avatar-wrap" style="${images.avatar ? `background-image:url(${images.avatar})` : ''}"></div>
        ${images.logo ? `<div class="logo-box"><img src="${images.logo}"></div>` : ''}
      </div>
      <div class="card-body">
        <div class="c-name">${f['f-name'] || ''}</div>
        ${f['f-title'] ? `<div class="c-line">${f['f-title']}</div>` : ''}
        ${f['f-dept'] ? `<div class="c-line">${f['f-dept']}</div>` : ''}
        ${f['f-company'] ? `<div class="c-line">${f['f-company']}</div>` : ''}
        ${f['f-sub'] ? `<div class="c-sub">${f['f-sub']}</div>` : ''}

        ${rows.length ? `<div class="contacts">${rows.map(r => `
          <a class="contact-row" href="${hrefFor(r.type, contactFields[r.type])}" target="_blank" rel="noopener">
            <div class="c-icon">${iconFor(r.type)}</div>
            <div class="c-text"><b>${r.val}</b>${r.label ? `<span>${r.label}</span>` : ''}</div>
          </a>`).join('')}</div>` : ''}

        ${badges.length ? `<div class="card-section-label">Credentials</div><div class="badges">${badges.map(b=>`<div>${b}</div>`).join('')}</div>` : ''}
        ${services.length ? `<div class="card-section-label">Our Services</div><div class="services">${services.map(s=>`<div class="service-item"><span class="tick">✓</span><span>${s}</span></div>`).join('')}</div>` : ''}
        ${gallery.length ? `<div class="card-section-label">Our Work</div><div class="gallery">${gallery.map(src=>`<img src="${src}">`).join('')}</div>` : ''}

        <button class="save-btn" id="save-btn" type="button">Save Contact</button>
        <a class="brand-foot" href="https://nazrulstudio.uk" target="_blank" rel="noopener">Digital card by Nazrul Studio</a>
      </div>`;

    const root = document.getElementById('card-render');
    root.innerHTML = html;
    root.style.background = '#e9f7f2';

    root.querySelectorAll('.gallery img').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox(img.src));
    });
    document.getElementById('save-btn').addEventListener('click', ()=>{
      const blob = new Blob([buildVCard({
        name:f['f-name'], title:f['f-title'], company:f['f-company'], dept:f['f-dept'],
        phone:f['f-phone'], email:f['f-email'], website:f['f-website'], location:f['f-location']
      })], {type:'text/vcard'});
      const link = document.createElement('a');
      link.download = `${(f['f-name']||'contact').replace(/\s+/g,'-').toLowerCase()}.vcf`;
      link.href = URL.createObjectURL(blob);
      link.click();
      showToast('Contact downloaded');
    });
  }

  function showState(msg){
    document.getElementById('card-render').innerHTML = `<div class="state-msg">${msg}</div>`;
  }

  const id = new URLSearchParams(location.search).get('id');
  if(!id){
    showState('No card specified. Check the link you were given.');
  } else {
    getDoc(doc(db, 'cards', id))
      .then(snap=>{
        if(!snap.exists()){ showState('This card could not be found.'); return; }
        renderCard(snap.data());
      })
      .catch(err=>{
        console.error(err);
        showState('Could not load this card right now. Please try again shortly.');
      });
  }
</script>

</body>
</html>
